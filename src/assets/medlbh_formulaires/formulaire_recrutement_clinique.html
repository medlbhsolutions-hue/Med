<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire de Recrutement - MedLBH Solutions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Open Sans', sans-serif;
            background-color: #f5f9ff;
            color: #333;
        }

        .header {
            background-color: #0056b3;
            color: white;
            padding: 20px 0;
            margin-bottom: 30px;
        }

        .logo-container {
            background-color: white;
            border-radius: 10px;
            padding: 10px;
            display: inline-block;
            margin-right: 20px;
        }

        .form-container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin-bottom: 30px;
        }

        .section-title {
            color: #0056b3;
            border-bottom: 2px solid #ff6b00;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .btn-primary {
            background-color: #0056b3;
            border-color: #0056b3;
        }

        .btn-primary:hover {
            background-color: #003d80;
            border-color: #003d80;
        }

        .required-field::after {
            content: " *";
            color: #ff6b00;
        }
    </style>
</head>

<body>
    <div class="header text-center">
        <div class="logo-container">
            <img src="/home/ubuntu/presentation_images/medlbh_logo.jpeg" alt="MedLBH Solutions Logo" height="60">
        </div>
        <h1>Formulaire de Recrutement de Médecins Spécialistes</h1>
        <p>Pour les cliniques et établissements de santé</p>
    </div>

    <div class="container">
        <div class="form-container">
            <form id="recruitmentForm">
                <!-- Informations sur l'établissement -->
                <h3 class="section-title">Informations sur l'établissement</h3>
                <div class="row mb-4">
                    <div class="col-md-6">
                        <label for="clinicName" class="form-label required-field">Nom de l'établissement</label>
                        <input type="text" class="form-control" id="clinicName" required>
                    </div>
                    <div class="col-md-6">
                        <label for="clinicType" class="form-label required-field">Type d'établissement</label>
                        <select class="form-select" id="clinicType" required>
                            <option value="" selected disabled>Sélectionner...</option>
                            <option value="clinique_privee">Clinique privée</option>
                            <option value="hopital_prive">Hôpital privé</option>
                            <option value="centre_medical">Centre médical</option>
                            <option value="autre">Autre</option>
                        </select>
                    </div>
                </div>

                <div class="row mb-4">
                    <div class="col-md-6">
                        <label for="city" class="form-label required-field">Ville</label>
                        <input type="text" class="form-control" id="city" required>
                    </div>
                    <div class="col-md-6">
                        <label for="country" class="form-label required-field">Pays</label>
                        <input type="text" class="form-control" id="country" required>
                    </div>
                </div>

                <div class="row mb-4">
                    <div class="col-md-6">
                        <label for="contactPerson" class="form-label required-field">Personne à contacter</label>
                        <input type="text" class="form-control" id="contactPerson" required>
                    </div>
                    <div class="col-md-6">
                        <label for="position" class="form-label required-field">Fonction</label>
                        <input type="text" class="form-control" id="position" required>
                    </div>
                </div>

                <div class="row mb-4">
                    <div class="col-md-6">
                        <label for="email" class="form-label required-field">Email</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    <div class="col-md-6">
                        <label for="phone" class="form-label required-field">Téléphone</label>
                        <input type="tel" class="form-control" id="phone" required>
                    </div>
                </div>

                <!-- Besoins en recrutement -->
                <h3 class="section-title">Besoins en recrutement</h3>
                <div class="row mb-4">
                    <div class="col-md-6">
                        <label for="speciality" class="form-label required-field">Spécialité recherchée</label>
                        <select class="form-select" id="speciality" required>
                            <option value="" selected disabled>Sélectionner...</option>
                            <option value="cardiologie">Cardiologie</option>
                            <option value="dermatologie">Dermatologie</option>
                            <option value="gastroenterologie">Gastro-entérologie</option>
                            <option value="gynecologie">Gynécologie</option>
                            <option value="neurologie">Neurologie</option>
                            <option value="ophtalmologie">Ophtalmologie</option>
                            <option value="orthopedie">Orthopédie</option>
                            <option value="pediatrie">Pédiatrie</option>
                            <option value="psychiatrie">Psychiatrie</option>
                            <option value="radiologie">Radiologie</option>
                            <option value="autre">Autre</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="otherSpeciality" class="form-label">Si autre, précisez</label>
                        <input type="text" class="form-control" id="otherSpeciality">
                    </div>
                </div>

                <div class="row mb-4">
                    <div class="col-md-6">
                        <label for="positionsNumber" class="form-label required-field">Nombre de postes</label>
                        <input type="number" class="form-control" id="positionsNumber" min="1" required>
                    </div>
                    <div class="col-md-6">
                        <label for="contractType" class="form-label required-field">Type de contrat</label>
                        <select class="form-select" id="contractType" required>
                            <option value="" selected disabled>Sélectionner...</option>
                            <option value="cdi">CDI</option>
                            <option value="cdd">CDD</option>
                            <option value="liberal">Libéral</option>
                            <option value="mixte">Mixte</option>
                            <option value="autre">Autre</option>
                        </select>
                    </div>
                </div>

                <div class="row mb-4">
                    <div class="col-md-6">
                        <label for="startDate" class="form-label required-field">Date de début souhaitée</label>
                        <input type="date" class="form-control" id="startDate" required>
                    </div>
                    <div class="col-md-6">
                        <label for="urgencyLevel" class="form-label required-field">Niveau d'urgence</label>
                        <select class="form-select" id="urgencyLevel" required>
                            <option value="" selected disabled>Sélectionner...</option>
                            <option value="immediate">Immédiat</option>
                            <option value="high">Urgent (1-3 mois)</option>
                            <option value="medium">Moyen terme (3-6 mois)</option>
                            <option value="low">Long terme (6+ mois)</option>
                        </select>
                    </div>
                </div>

                <!-- Conditions offertes -->
                <h3 class="section-title">Conditions offertes</h3>
                <div class="row mb-4">
                    <div class="col-md-6">
                        <label for="salaryRange" class="form-label">Fourchette de rémunération (annuelle)</label>
                        <select class="form-select" id="salaryRange">
                            <option value="" selected disabled>Sélectionner...</option>
                            <option value="range1">Moins de 50 000 €</option>
                            <option value="range2">50 000 € - 80 000 €</option>
                            <option value="range3">80 000 € - 120 000 €</option>
                            <option value="range4">120 000 € - 150 000 €</option>
                            <option value="range5">Plus de 150 000 €</option>
                            <option value="negotiable">À négocier</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="workingHours" class="form-label">Horaires de travail</label>
                        <input type="text" class="form-control" id="workingHours"
                            placeholder="Ex: 40h/semaine, gardes...">
                    </div>
                </div>

                <div class="row mb-4">
                    <div class="col-12">
                        <label for="benefits" class="form-label">Avantages proposés</label>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="housing">
                            <label class="form-check-label" for="housing">Logement</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="relocation">
                            <label class="form-check-label" for="relocation">Aide à la relocalisation</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="familySupport">
                            <label class="form-check-label" for="familySupport">Accompagnement familial</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="training">
                            <label class="form-check-label" for="training">Formation continue</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="otherBenefits">
                            <label class="form-check-label" for="otherBenefits">Autres</label>
                        </div>
                    </div>
                </div>

                <div class="row mb-4">
                    <div class="col-12">
                        <label for="additionalInfo" class="form-label">Informations complémentaires</label>
                        <textarea class="form-control" id="additionalInfo" rows="4"
                            placeholder="Précisez toute information supplémentaire concernant le poste, l'établissement ou les conditions offertes..."></textarea>
                    </div>
                </div>

                <div class="row mt-5">
                    <div class="col-12 text-center">
                        <button type="submit" class="btn btn-primary btn-lg">Soumettre la demande</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <footer class="bg-light text-center text-muted py-4">
        <div class="container">
            <p>© 2025 MedLBH Solutions - Medical & Human Bridges</p>
            <p>Contact : contact@medlbhsolution.ma | +212 6 90 40 52 69</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
